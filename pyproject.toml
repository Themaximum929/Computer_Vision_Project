[project]
name = "computer-vision-project"
version = "0.1.0"
description = "Add your description here"
readme = "README.md"
requires-python = ">=3.13"
dependencies = [
    "accelerate==1.11.0",
    "beautifulsoup4==4.14.2",
    "diffusers==0.35.2",
    "gradio==5.49.1",
    "huggingface-hub==0.36.0",
    "numpy==2.2.6",
    "opencv-python==4.12.0.88",
    "peft==0.17.1",
    "pillow==11.3.0",
    "pytesseract==0.3.13",
    "python-dotenv>=1.2.1",
    "requests==2.32.5",
    "safetensors==0.6.2",
    "scikit-learn==1.7.2",
    "torch==2.9.0",
    "torchvision==0.24.0",
    "tqdm==4.67.1",
    "transformers==4.57.1",
    "sentencepiece>=0.2.0",
    "protobuf>=4.25.0",
]

[[tool.uv.index]]
name = "pytorch-cu128"
url = "https://download.pytorch.org/whl/cu128"
explicit = true

[tool.uv.sources]
torch = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
torchvision = [
  { index = "pytorch-cu128", marker = "sys_platform == 'linux' or sys_platform == 'win32'" },
]
